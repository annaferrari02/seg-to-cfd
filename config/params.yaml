# Tunable parameters. Loaded at the command boundary (cli) and passed down.
# Geometry / transform (the ONE Slicer->SV transform lives in sv_match_core)
scale: 0.1
sv_frame: LPS               # frame SimVascular geometry is in
flow_ext_length: 25.0     # <-- your tunable knob: Slicer clip-vessel flow extension
match_tol_cm: 0.5           # tolerance added to expected extension in sv_match.validate
ambiguity_margin_cm: 0.2    # below this, a cap<->endpoint assignment is flagged for a human
radius_array: Radius        # point-data array name in the centerline .vtk
max_snap_dist_mm: 5.0       # tag_endpoints frame-mismatch guard

# SimVascular / meshing
separation_angle: 50
# extract_faces : remesh di pulizia 
remesh_hmin: 0.02
remesh_hmax: 0.25
remesh_hausd: 0.005

quality_threshold: 400            # mesh_quality gate: fail if >= this
max_geom_cm: 100            # paraview transform guard: fail if extent exceeds (mm not scaled)
clip-offset: 3.0        #quanto indietro andare nel cut vessel (evitare flow extensions improprie)
# Simulation
mpi_ranks: 16
bl: True                #boundary layer 
gmes: 0.25                #global max edge size 
portion_edge_size: 0.20    #the portion of the edge size to use as the size for the initial boundary layer (typically this is a value between zero and one.
                          # si abbassa se troppo fine per meshing (decrease di 0.10 ogni tentativo)
bl_num_layers: 2            #default, it's the number of layers desired. Too many layers can cause self intersections on smaller vessels, so be careful.
bl_decreasing_ratio: 0.60   # the amount of the size decrease between successive boundary layers. This gradation factor is multiplied by t
                            #he previous layer to get the thickness of the new layer. In order to decrease the layers by a factor of 2, apply a decreasing ratio of 0.5.


launcher: {}