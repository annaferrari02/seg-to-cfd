# Single source of truth for stage ORDER and TYPE (data, not code).
# Keys per stage:
#   name    : unique stage id, also the ledger key
#   type    : auto | human | gate | async
#   adapter : which adapter in the registry runs it
#   action  : optional sub-action for multi-purpose adapters
stages:
  - {name: slicer,        type: interactive, adapter: slicer}
  - {name: paraview,      type: auto,  adapter: paraview,    action: transform}
  - {name: sv_extract,    type: auto,  adapter: simvascular, action: extract}
  - {name: tag_endpoints, type: auto,  adapter: tag}
  - {name: sv_match,      type: gate,  adapter: sv_match}
  - {name: sv_apply,      type: auto,  adapter: simvascular, action: apply}
  - {name: mesh_qc,       type: gate,  adapter: paraview,    action: quality}
  - {name: simulation,    type: async, adapter: simvascular, action: simulate}


